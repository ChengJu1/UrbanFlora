name: urban_flora
description: "UrbanFlora — turn every walk into a citizen-science biodiversity log."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State & routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Firebase
  firebase_core: ^3.4.0
  firebase_auth: ^5.2.0
  cloud_firestore: ^5.3.0
  firebase_storage: ^12.2.0
  google_sign_in: ^6.2.1

  # Camera & media
  camera: ^0.11.0+1
  image_picker: ^1.1.2

  # Sensors & location
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  flutter_compass: ^0.8.1

  # Networking
  dio: ^5.7.0
  cached_network_image: ^3.4.1

  # Map
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # UX
  shimmer: ^3.0.0
  lottie: ^3.1.2
  flutter_animate: ^4.5.0
  cupertino_icons: ^1.0.8

  # Utils
  intl: ^0.19.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.1
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/seed/

flutter_native_splash:
  color: "#0B3D2E"
  color_dark: "#07251B"
  image: assets/images/splash_logo.png
  image_dark: assets/images/splash_logo.png
  android_12:
    color: "#0B3D2E"
    color_dark: "#07251B"
    image: assets/images/splash_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 23
