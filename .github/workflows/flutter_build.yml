name: Flutter Build and Upload Android APK
on:
  push:           
    branches: [ main ]  

jobs:
  build:
    runs-on: ubuntu-latest 
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4     
      - name: Set up JDK              
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: zulu

      - name: Install yq
        uses: mikefarah/yq@v4.42.1
      - name: Get pubspec version
        id: get_flutter_app_version
        run: |
          VERSION=$(yq .version | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' pubspec.yaml | head -n 1)
          echo "TAG_VERSION=$VERSION" >> $GITHUB_OUTPUT
  
      - name: Create git tag
        run: |
          git tag "v${{ steps.get_flutter_app_version.outputs.TAG_VERSION }}"
      - name: Install Flutter              
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.x'
          channel: stable
          cache: true
      - name: Write api_keys.dart from secrets
        env:
          PLANTNET_API_KEY: ${{ secrets.PLANTNET_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: |
          cp lib/core/constants/api_keys.dart.example lib/core/constants/api_keys.dart
          if [ -n "$PLANTNET_API_KEY" ]; then
            sed -i "s|YOUR_PLANTNET_API_KEY|$PLANTNET_API_KEY|" lib/core/constants/api_keys.dart
          fi
          if [ -n "$OPENWEATHER_API_KEY" ]; then
            sed -i "s|YOUR_OPENWEATHER_API_KEY|$OPENWEATHER_API_KEY|" lib/core/constants/api_keys.dart
          fi
      - name: Get Flutter dependencies    
        run: flutter pub get
      - name: Build APK Release             
        run: flutter build apk --release
      - name: Build an AppBundle          
        run: flutter build appbundle --release
      - name: Save APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flutter-apk
          path: build/app/outputs/flutter-apk/*.apk
      - name: Save APPBUNDLE to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flutter-appbundle
          path: build/app/outputs/bundle/release/*.aab
      - name: Create Github Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/app/outputs/bundle/release/*.aab,build/app/outputs/flutter-apk/*.apk"
          tag: "v${{ steps.get_flutter_app_version.outputs.TAG_VERSION }}"
          allowUpdates: true
          replacesArtifacts: true
         