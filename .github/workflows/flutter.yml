name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.x"
          channel: stable
          cache: true

      - name: Print Flutter version
        run: flutter --version

      # api_keys.dart is .gitignored; CI uses the committed example so the
      # project still compiles without leaking real secrets.
      - name: Provide placeholder API keys
        run: cp lib/core/constants/api_keys.dart.example lib/core/constants/api_keys.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --fatal-infos
